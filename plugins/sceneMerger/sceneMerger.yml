name: "Scene Merger"
description: "Merges duplicate scenes that share the same StashDB ID."
version: "1.0"
exec:
  - python
  - "{pluginDir}/sceneMerger.py"
interface: raw

tasks:
  - name: "Run AutoMerge (DRY RUN)"
    description: "Logs what would be merged. Does not alter the database."
    defaultArgs:
      mode: manual_dry_run
  - name: "Run AutoMerge (EXECUTE)"
    description: "Actually performs the merge operations."
    defaultArgs:
      mode: manual_execute

hooks:
  - name: "AutoMerge on Scene Update"
    description: "Runs automatically when a scene is identified."
    triggeredBy:
      - Scene.Update.Post
    defaultArgs:
      mode: hook